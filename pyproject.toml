[project]
name = "infoviz"
version = "0.1.0"
description = "Information Visualization CS-E4840"
authors = [
    { name = "lauriprudant", email = "prudant.lauri@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "cmasher>=1.9.2",
    "colorcet>=3.1.0",
    "geodatasets>=2026.5.1",
    "geopandas>=1.1.4",
    "jupyterlab>=4.5.5",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"
